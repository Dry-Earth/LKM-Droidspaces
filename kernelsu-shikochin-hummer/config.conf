# droidspaces_hummer 运行时配置
# 修改后重启生效；也可以直接删掉对应 .ko 前先看 README 的限制。

# 主模块：PID / IPC / SYSVIPC / POSIX mqueue（必须为 1）
namespace=1

# devtmpfs：给容器 /dev 提供设备节点；构建失败时自动跳过
devtmpfs=1

# Docker nftables / xt_addrtype：上游源码是 6.12 快照，6.6 默认不构建
netfilter=0

# USER_NS 沙箱：使用 droidspaces_ns_userns.ko（如果构建成功）
# 6.6 上尚未完成移植，默认关闭；不要把它当真正的安全隔离。
userns=0
