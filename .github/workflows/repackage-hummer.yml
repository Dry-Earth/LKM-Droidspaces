name: Repackage hummer phDroid (safety update)

# 不重新编内核，只把已有 run 的 ko 用最新的 module/ 脚本重新打包。
# 用于快速迭代 no_boot / 存活窗口 / crash_count / pstore 等安全逻辑。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '已成功的 Build hummer phDroid run ID（例如 42223499194）'
        required: true
        type: string
        default: '42223499194'
      safe_mode:
        description: '安全模式：skip_do_exit=1、compat=off'
        required: true
        type: boolean
        default: false
      publish_release:
        description: '构建成功后发布 Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  KERNEL_SHA: 6350e8af3f4c452d087fbd6fe1aabe03cbc0af75
  EXPECTED_RELEASE: 6.6.144-4k-g6350e8af3f4c
  CLANG_REV: clang-r596125
  KMI: android15-6.6

jobs:
  repackage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download ko artifact from the build run
        uses: actions/download-artifact@v4
        with:
          name: phdroid-hummer-${{ inputs.run_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art

      - name: Collect ko
        run: |
          set -eux
          mkdir -p out/android15-6.6
          cp art/out/android15-6.6/*.ko out/android15-6.6/
          ls -lh out/android15-6.6
          for k in out/android15-6.6/*.ko; do
            printf '%s: ' "$k"
            strings "$k" | grep -m1 'vermagic=' || true
          done

      - name: Patch package for hummer
        env:
          SAFE_MODE: ${{ inputs.safe_mode }}
        run: bash ci/patch-package.sh

      - name: Package KernelSU zip
        run: |
          set -eux
          command -v zip >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y zip; }
          sh scripts/package-module.sh "$KMI"
          ls -lh dist
          sha256sum dist/*.zip
          unzip -l dist/*.zip | sed -n '1,60p'

      - name: Write build info
        run: |
          set -eux
          {
            echo "device:        OnePlus Ace 5 Pro (hummer)"
            echo "rom:           LineageOS 24.0 (20261030)"
            echo "release:       ${EXPECTED_RELEASE}"
            echo "source run:    https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.run_id }}"
            echo "safe mode:     ${{ inputs.safe_mode }}"
            echo
            echo "build-id:"
            cat module/build-id.txt
            echo
            echo "module sha256:"
            find out -maxdepth 2 -name '*.ko' -exec sha256sum {} + | sort
            echo
            echo "vermagic:"
            for k in out/*/*.ko; do printf '%s: ' "$k"; strings "$k" | grep -m1 'vermagic=' || true; done
            echo
            echo "zip sha256:"
            sha256sum dist/*.zip
          } > build-info.txt
          cat build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phdroid-hummer-safety-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/*.zip
            out/*/*.ko
            module/build-id.txt
            module/module.prop
            build-info.txt

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          tag="phdroid-hummer-safety-${GITHUB_RUN_ID}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip build-info.txt -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/*.zip build-info.txt \
              -R "$GITHUB_REPOSITORY" \
              --title "phDroid hummer safety ${GITHUB_RUN_ID}" \
              --notes-file build-info.txt
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url -q .url
